# Helmholtz PDE Solver Configuration

data:
  train_path: helmholtz_solver/data/helmholtz_64_train_demo.mat
  test_path: helmholtz_solver/data/helmholtz_64_test_demo.mat
  n_test: 100

model:
  type: FNO_CNN          # options: FNO_CNN, UNet
  in_channels: 3         # [f, u_pred, l_pde]
  out_channels: 1
  hidden_channels: 64
  n_modes: [20, 20]
  n_layers: 4

training:
  seed: 33
  n_epochs: 10000
  batch_size: 32
  lr: 1.0e-4
  T: 5                   # iterative correction steps per training sample
  alpha: 0.1             # correction step size during training
  save_path: checkpoints/helmholtz.pth
  log_interval: 10

pde:
  k: 1                   # wavenumber used during training

inference:
  k: 1                 # wavenumber used at test time (extrapolation)
  T_test: 20            # iterative correction steps at test time
  step_size: 0.1       # correction step size at test time
  checkpoint: checkpoints/helmholtz.pth
  results_dir: results/
  vis_sample_idx: 13    # which test sample to visualize
