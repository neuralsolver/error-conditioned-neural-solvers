# NS PDE Solver Configuration

data:
  train_path: NS_solver/data/NS_64_train_demo.mat
  test_path: NS_solver/data/helmholtz_NS_test_demo.mat
  n_test: 100

model0:
  type: FNO_CNN          # options: FNO_CNN, UNet
  in_channels: 1         
  out_channels: 20
  hidden_channels: 64
  n_modes: [20, 20]
  n_layers: 4

model0:
  type: FNO_CNN          # options: FNO_CNN, UNet
  in_channels: 41         
  out_channels: 20
  hidden_channels: 64
  n_modes: [20, 20]
  n_layers: 4

training:
  seed: 33
  n_epochs: 10000
  batch_size: 32
  lr: 1.0e-4
  T: 5                   # iterative correction steps per training sample
  alpha: 0.1             # correction step size during training
  save_path: checkpoints/NS.pth
  log_interval: 10

pde:
  visc: 0.001                   # viscosity used during training
  forcing: 
    type: "cosine_xy"  # 'cosine_y' for KF
      amplitude: 0.1
      frequency: 4
  dt: 0.1
      
inference:s
  visc: 0.001                # viscosity used at test time (extrapolation)
  
  forcing: 
    type: "cosine_xy"        # forxing used at test time (extrapolation_
      amplitude: 0.1
      frequency: 4
      
  dt: 0.1
  
  T_test: 20            # iterative correction steps at test time
  step_size: 0.1       # correction step size at test time
  checkpoint: checkpoints/NS.pth
  results_dir: results/
  vis_sample_idx: 13    # which test sample to visualize
